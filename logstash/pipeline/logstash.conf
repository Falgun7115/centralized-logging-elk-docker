input {
  file {
    path => "/usr/share/logstash/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"
  }
}

filter {
  # ---- Application logs:  2026-10-13T10:15:30.123Z ERROR [payment-service] host=web-01 user=u123 msg="Payment gateway timeout"
  if [log][file][path] =~ /app\.log$/ or [path] =~ /app\.log$/ or [message] =~ /^\d{4}-\d{2}-\d{2}T/ {
    grok {
      match => { "message" => '^%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:log_level} \[%{DATA:service}\] host=%{DATA:host_name} user=%{DATA:user} msg="%{DATA:log_message}"$' }
      tag_on_failure => ["_app_grok_failure"]
    }
    mutate { add_field => { "log_type" => "application" } }
  }
  # ---- Web access logs (Apache/Nginx combined format) + response time
  else {
    grok {
      match => { "message" => '%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:log_time}\] "%{WORD:http_method} %{DATA:url} HTTP/%{NUMBER:http_version}" %{NUMBER:http_status:int} %{NUMBER:bytes:int} "%{DATA:referrer}" "%{DATA:agent}" %{NUMBER:response_time_ms:int}' }
      tag_on_failure => ["_access_grok_failure"]
    }
    mutate { add_field => { "log_type" => "access" "service" => "nginx" } }
    # derive a log level from the HTTP status so both log types can be filtered together
    if [http_status] >= 500 {
      mutate { add_field => { "log_level" => "ERROR" "log_message" => "HTTP %{http_status} on %{http_method} %{url}" } }
    } else if [http_status] >= 400 {
      mutate { add_field => { "log_level" => "WARN" "log_message" => "HTTP %{http_status} on %{http_method} %{url}" } }
    } else {
      mutate { add_field => { "log_level" => "INFO" "log_message" => "HTTP %{http_status} on %{http_method} %{url}" } }
    }
    geoip { source => "client_ip" target => "geoip" tag_on_failure => [] }
  }

  # Use the log's own timestamp as @timestamp
  date {
    match => [ "log_time", "ISO8601", "dd/MMM/yyyy:HH:mm:ss Z" ]
    target => "@timestamp"
    remove_field => ["log_time"]
  }

  mutate {
    uppercase => [ "log_level" ]
    remove_field => [ "event", "host", "[log][file][path]", "path", "@version" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => dots }
}
